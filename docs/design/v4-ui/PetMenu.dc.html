<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>桌宠与右键菜单</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2F5BEA}a:hover{color:#1E3FB8}
</style>
</helmet>
<div style="width: 600px; height: 760px; box-sizing: border-box; background: #DCE6F5; font-family: 'Noto Sans SC', 'Microsoft YaHei UI', sans-serif; color: #13234A; position: relative; overflow: hidden">
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 48px; background: rgba(255,255,255,0.72); border-top: 1px solid #C9D5EA"></div>

  <div style="position: absolute; left: 34px; top: 120px; max-width: 200px; background: #FFFFFF; border: 1px solid #D9E1F2; border-radius: 18px 18px 18px 6px; padding: 10px 14px; font-size: 14px; line-height: 1.6">喝口水吧～你已经盯着屏幕一个半小时了</div>
  <img src="../../../src/aicompanion/characters/deepseek-whale/sprites/talking.png" alt="桌面上的鲸鲸" style="position: absolute; left: 40px; top: 220px; width: 230px; height: 308px; object-fit: contain">

  <div style="position: absolute; left: 300px; top: 70px; width: 262px; background: #FFFFFF; border: 1px solid #DCE4F2; border-radius: 18px; padding: 8px; box-shadow: 0 12px 32px rgba(19,35,74,0.18); display: flex; flex-direction: column">
    <div style="display: flex; align-items: center; gap: 10px; padding: 8px 10px 10px">
      <img src="../../../src/aicompanion/assets/icons/aicompanion-256.png" alt="" style="width: 32px; height: 32px; border-radius: 50%">
      <div style="display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 700">鲸鲸</span><span style="font-size: 12px; color: #5A6787">在线 · 心情不错</span></div>
    </div>
    <div style="height: 1px; background: #EEF1F7; margin: 0 6px 4px"></div>
    <div style="font-size: 12px; font-weight: 500; color: #5A6787; padding: 6px 10px 2px">和她说话</div>
    <button type="button" style="display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 10px; border: none; border-radius: 10px; background: #E6EEFF; font: inherit; font-size: 14px; color: #13234A; text-align: left">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2F5BEA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
      <span style="flex-grow: 1">说点什么…</span><span style="font-size: 12px; color: #5A6787">双击她</span></button>
    <button type="button" style="display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 10px; border: none; border-radius: 10px; background: transparent; font: inherit; font-size: 14px; color: #13234A; text-align: left">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4B587A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"></rect><path d="M7 9h10M7 13h6"></path></svg>
      <span style="flex-grow: 1">打开聊天窗口</span></button>
    <button type="button" style="display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 10px; border: none; border-radius: 10px; background: transparent; font: inherit; font-size: 14px; color: #13234A; text-align: left">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4B587A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0"></path><path d="M12 18v3"></path></svg>
      <span style="flex-grow: 1">语音聊天</span><span style="font-size: 12px; color: #5A6787">戴耳机更好</span></button>

    <div style="font-size: 12px; font-weight: 500; color: #5A6787; padding: 10px 10px 2px">让她帮忙</div>
    <button type="button" style="display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 10px; border: none; border-radius: 10px; background: transparent; font: inherit; font-size: 14px; color: #13234A; text-align: left">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4B587A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.5-.5-.5-2.5z"></path></svg>
      <span style="flex-grow: 1">交给她一件事…</span></button>
    <button type="button" style="display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 10px; border: none; border-radius: 10px; background: transparent; font: inherit; font-size: 14px; color: #13234A; text-align: left">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4B587A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
      <span style="flex-grow: 1">专注一会儿（她不打扰）</span><span style="color: #5A6787">›</span></button>

    <div style="font-size: 12px; font-weight: 500; color: #5A6787; padding: 10px 10px 2px">她的样子</div>
    <button type="button" style="display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 10px; border: none; border-radius: 10px; background: transparent; font: inherit; font-size: 14px; color: #13234A; text-align: left">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4B587A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.4 6.8 19.1l1-5.8L3.5 9.2l5.9-.9z"></path></svg>
      <span style="flex-grow: 1">做个动作</span><span style="color: #5A6787">›</span></button>
    <button type="button" style="display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 10px; border: none; border-radius: 10px; background: transparent; font: inherit; font-size: 14px; color: #13234A; text-align: left">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4B587A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"></path></svg>
      <span style="flex-grow: 1">大小</span><span style="font-size: 12px; color: #5A6787">100%</span><span style="color: #5A6787">›</span></button>

    <div style="height: 1px; background: #EEF1F7; margin: 6px 6px"></div>
    <button type="button" style="display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 10px; border: none; border-radius: 10px; background: transparent; font: inherit; font-size: 14px; color: #13234A; text-align: left">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4B587A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"></path></svg>
      <span style="flex-grow: 1">设置…</span></button>
    <button type="button" style="display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 10px; border: none; border-radius: 10px; background: transparent; font: inherit; font-size: 14px; color: #13234A; text-align: left">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4B587A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"></path></svg>
      <span style="flex-grow: 1">让她休息（藏到右下角）</span></button>
    <button type="button" style="display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 10px; border: none; border-radius: 10px; background: transparent; font: inherit; font-size: 14px; color: #A3361A; text-align: left">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A3361A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18.4 6.6a9 9 0 1 1-12.8 0"></path><path d="M12 2v10"></path></svg>
      <span style="flex-grow: 1">退出鲸伴</span></button>
  </div>

  <div style="position: absolute; left: 24px; right: 24px; bottom: 64px; background: rgba(255,255,255,0.86); border-radius: 14px; padding: 12px 14px; font-size: 12px; line-height: 1.7; color: #4B587A">
    原菜单 20 多项平铺；改为 3 组 + 常用项。<b style="color: #13234A">切换角色</b>放进“她的样子”（只有一个角色时隐藏）；<b style="color: #13234A">动画版本、走几步、配色、开机启动</b>这些调试或低频项移到 设置 → 角色与形象 → 更多。“打断回复”只在她正在说话时出现。
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":600,"height":760}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
